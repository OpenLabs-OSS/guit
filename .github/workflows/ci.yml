# Guit CI Pipeline

name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  QT_VERSION: 6.5
  MINGW_VERSION: 13.1

jobs:
  build-and-test:
    name: Windows Build and Test
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_mingw
          modules: qtbase qtsvg qttools
          cache: true

      - name: Setup Ninja
        run: |
          choco install ninja --version 1.12.1 --no-progress
          echo "C:\Program Files\Ninja" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Setup CMake
        run: |
          choco install cmake --version 3.28.1 --no-progress
          echo "C:\Program Files\CMake\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Configure
        run: >
          cmake
          -S .
          -B build
          -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_COMPILER=C:/Qt/Tools/mingw1310_64/bin/g++.exe
          -DCMAKE_PREFIX_PATH=C:/Qt/6.5/mingw_64

      - name: Build
        run: cmake --build build --config Release

      - name: Run Tests
        run: ctest --test-dir build --output-on-failure

      - name: Deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: cmake --build build --target deploy

      - name: Create Portable Package
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $zipPath = "build/Guit-ci-windows-x64.zip"

          Compress-Archive `
            -Path "build/deploy/*" `
            -DestinationPath $zipPath `
            -Force

      - name: Generate Checksums
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $zipPath = "build/Guit-ci-windows-x64.zip"
          $zipHash = (Get-FileHash -Algorithm SHA256 $zipPath).Hash.ToLower()
          $zipName = Split-Path $zipPath -Leaf

          "$zipHash  $zipName" |
            Set-Content -Path "build/SHA256SUMS.txt" -Encoding utf8

      - name: Upload CI Artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: Guit-ci-windows-x64
          path: |
            build/Guit-ci-windows-x64.zip
            build/SHA256SUMS.txt
          retention-days: 30

  clang-tidy:
    name: Clang-Tidy
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtbase qtsvg qttools
          cache: true

      - name: Install Clang-Tidy
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy-18

      - name: Configure
        run: |
          cmake \
            -S . \
            -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_CLANG_TIDY=clang-tidy-18 \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"

      - name: Run Clang-Tidy
        run: cmake --build build

  docs:
    name: Documentation Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Documentation
        shell: bash
        run: |
          files=(
            README.md
            CONTRIBUTING.md
            CODE_OF_CONDUCT.md
            SECURITY.md
            docs/architecture.md
            docs/development.md
            docs/git-concepts.md
          )

          for file in "${files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "Missing: $file"
              exit 1
            fi
          done

          echo "All documentation files are present."
