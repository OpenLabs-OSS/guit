name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  QT_VERSION: 6.8.3

jobs:
  build-and-test:
    name: Build and Test (Windows)
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_mingw
          archives: qtbase
          cache: true

      - name: Setup Ninja
        shell: pwsh
        run: |
          choco install ninja --version 1.12.1 --no-progress
          "C:\Program Files\Ninja" |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Setup CMake
        shell: pwsh
        run: |
          choco install cmake --version 3.28.1 --no-progress
          "C:\Program Files\CMake\bin" |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Setup Git
        shell: pwsh
        run: |
          choco install git --version 2.45.0 --no-progress
          "C:\Program Files\Git\cmd" |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build `
            -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DGUIT_BUILD_TESTS=ON `
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Run Tests
        run: ctest --test-dir build --output-on-failure

      - name: Deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: cmake --build build --target deploy --config Release

      - name: Create Portable Package
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          Compress-Archive `
            -Path build/deploy/* `
            -DestinationPath "build/Guit-${{ github.ref_name }}-windows-x64.zip" `
            -Force

      - name: Generate Checksums
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $zip = "build/Guit-${{ github.ref_name }}-windows-x64.zip"
          $exe = "build/deploy/guit.exe"

          $zipHash = (Get-FileHash -Algorithm SHA256 $zip).Hash
          $exeHash = (Get-FileHash -Algorithm SHA256 $exe).Hash

          @"
          # SHA256 Checksums for Guit ${{ github.ref_name }}

          SHA256(Guit-${{ github.ref_name }}-windows-x64.zip) = $zipHash
          SHA256(guit.exe) = $exeHash
          "@ | Out-File `
            -FilePath build/checksums.txt `
            -Encoding utf8

      - name: Upload CI Artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: Guit-${{ github.ref_name }}-windows-x64
          path: |
            build/Guit-${{ github.ref_name }}-windows-x64.zip
            build/checksums.txt
            build/deploy/guit.exe
          retention-days: 30

  clang-tidy:
    name: Clang-Tidy
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: gcc_64
          archives: qtbase
          cache: true

      - name: Install Clang-Tidy
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DGUIT_BUILD_TESTS=OFF \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Run Clang-Tidy
        shell: bash
        run: |
          set -e

          find src tools \
            -type f \
            \( -name "*.cpp" -o -name "*.cc" -o -name "*.cxx" \) \
            -print0 |
          xargs -0 -r clang-tidy \
            -p build \
            --warnings-as-errors='*'

  docs:
    name: Documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check documentation
        run: |
          for f in \
            README.md \
            CONTRIBUTING.md \
            CODE_OF_CONDUCT.md \
            SECURITY.md \
            docs/architecture.md \
            docs/development.md \
            docs/git-concepts.md
          do
            if [ ! -f "$f" ]; then
              echo "Missing: $f"
              exit 1
            fi
          done

          echo "All documentation files are present."
