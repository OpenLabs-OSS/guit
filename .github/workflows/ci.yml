name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  QT_VERSION: 6.8.3

jobs:
  build-and-test:
    name: Build and Test (Windows)
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_mingw
          tools: tools_mingw1310
          cache: true

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build `
            -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DGUIT_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Run Tests
        run: ctest --test-dir build --output-on-failure

      - name: Deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: cmake --build build --target deploy --config Release

      - name: Create Portable Package
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          Compress-Archive `
            -Path build/deploy/* `
            -DestinationPath "build/Guit-${{ github.ref_name }}-windows-x64.zip" `
            -Force

      - name: Generate Checksums
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $zip = "build/Guit-${{ github.ref_name }}-windows-x64.zip"
          $exe = "build/deploy/guit.exe"

          $zipHash = (Get-FileHash -Algorithm SHA256 $zip).Hash
          $exeHash = (Get-FileHash -Algorithm SHA256 $exe).Hash

          @"
          # SHA256 Checksums for Guit ${{ github.ref_name }}

          SHA256(Guit-${{ github.ref_name }}-windows-x64.zip) = $zipHash
          SHA256(guit.exe) = $exeHash
          "@ | Out-File `
            -FilePath build/checksums.txt `
            -Encoding utf8

      - name: Upload CI Artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: Guit-${{ github.ref_name }}-windows-x64
          path: |
            build/Guit-${{ github.ref_name }}-windows-x64.zip
            build/checksums.txt
            build/deploy/guit.exe
          retention-days: 30

  clang-tidy:
    name: Clang-Tidy
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          cache: true

      - name: Install Clang-Tidy
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy ninja-build

      - name: Verify Qt and Tools
        run: |
          echo "Qt installation:"
          find "$HOME/work/guit/Qt" -maxdepth 3 -type f -name "qmake" -o -name "qtpaths" 2>/dev/null | head -20 || true

          echo
          echo "CMake:"
          cmake --version

          echo
          echo "Ninja:"
          ninja --version

          echo
          echo "Clang-Tidy:"
          clang-tidy --version

      - name: Configure
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DGUIT_BUILD_TESTS=OFF \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Verify Compilation Database
        run: |
          test -f build/compile_commands.json
          echo "compile_commands.json generated successfully."

      - name: Run Clang-Tidy
        shell: bash
        run: |
          set -euo pipefail

          git ls-files \
            'src/*.cpp' \
            'src/**/*.cpp' \
            'src/*.cc' \
            'src/**/*.cc' \
            'src/*.cxx' \
            'src/**/*.cxx' \
            'tools/*.cpp' \
            'tools/**/*.cpp' \
            'tools/*.cc' \
            'tools/**/*.cc' \
            'tools/*.cxx' \
            'tools/**/*.cxx' \
            -z |
          xargs -0 -r clang-tidy -p build

  docs:
    name: Documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check documentation
        run: |
          for f in \
            README.md \
            CONTRIBUTING.md \
            CODE_OF_CONDUCT.md \
            SECURITY.md \
            docs/architecture.md \
            docs/development.md \
            docs/git-concepts.md
          do
            if [ ! -f "$f" ]; then
              echo "Missing: $f"
              exit 1
            fi
          done

          echo "All documentation files are present."
