# Guit CI Pipeline

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  QT_VERSION: 6.5
  QT_HOST_PATH: C:/Qt/6.5/mingw_64
  MINGW_PATH: C:/Qt/Tools/mingw1310_64

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_mingw
          modules: qtbase qtsvg qttools
          cache: true

      - name: Setup MinGW
        uses: ilammy/setup-mingw@v2
        with:
          version: 13.1
          threads: posix
          exception: seh

      - name: Setup Ninja
        run: |
          choco install ninja --version 1.12.1 --no-progress
          echo "C:\Program Files\Ninja" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Setup CMake
        run: |
          choco install cmake --version 3.28.1 --no-progress
          echo "C:\Program Files\CMake\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Setup Git
        run: |
          choco install git --version 2.45.0 --no-progress
          echo "C:\Program Files\Git\cmd" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=C:/Qt/Tools/mingw1310_64/bin/g++.exe \
            -DCMAKE_PREFIX_PATH=C:/Qt/6.5/mingw_64

      - name: Build
        run: cmake --build build --config Release

      - name: Run Tests
        run: ctest --test-dir build --output-on-failure

      - name: Deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: cmake --build build --target deploy

      - name: Create Portable Package
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          Compress-Archive -Path build/deploy/* -DestinationPath build/Guit-${{ github.ref_name }}-windows-x64.zip -Force

      - name: Generate Checksums
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          $zipHash = Get-FileHash -Algorithm SHA256 build/Guit-${{ github.ref_name }}-windows-x64.zip
          $exeHash = Get-FileHash -Algorithm SHA256 build/deploy/guit.exe
          @"
          # SHA256 Checksums for Guit ${{ github.ref_name }} Release Artifacts

          ## Portable Package
          SHA256(Guit-${{ github.ref_name }}-windows-x64.zip) = $($zipHash.Hash)

          ## Deployed Executable
          SHA256(guit.exe) = $($exeHash.Hash)
          "@ | Out-File -FilePath build/checksums.txt -Encoding utf8

      - name: Upload Artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: Guit-${{ github.ref_name }}-windows-x64
          path: |
            build/Guit-${{ github.ref_name }}-windows-x64.zip
            build/checksums.txt
            build/deploy/guit.exe
          retention-days: 30

  # Code quality checks
  clang-tidy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install clang-tidy
        run: sudo apt-get update && sudo apt-get install -y clang-tidy-18

      - name: Run clang-tidy
        run: |
          cmake -S . -B build -DCMAKE_CXX_CLANG_TIDY=clang-tidy-18
          cmake --build build 2>&1 | head -100

  # Documentation check
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check documentation
        run: |
          # Check required files exist
          for f in README.md CONTRIBUTING.md CODE_OF_CONDUCT.md SECURITY.md docs/architecture.md docs/development.md docs/git-concepts.md; do
            if [ ! -f "$f" ]; then
              echo "Missing: $f"
              exit 1
            fi
          done
          echo "All documentation files present"