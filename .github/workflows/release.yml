name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  QT_VERSION: 6.8.3

jobs:
  release:
    name: Build and Release (Windows)
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_mingw
          tools: tools_mingw1310
          cache: true

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build `
            -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DGUIT_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Run Tests
        run: ctest --test-dir build --output-on-failure

      - name: Deploy
        run: cmake --build build --target deploy --config Release

      - name: Get Release Version
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")

          Write-Host "Release version: $version"

          "version=$version" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8

      - name: Create Portable Package
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"

          $zip = "build/Guit-$version-windows-x64.zip"

          Compress-Archive `
            -Path build/deploy/* `
            -DestinationPath $zip `
            -Force

          if (-not (Test-Path $zip)) {
            Write-Error "Portable package was not created."
            exit 1
          }

          Write-Host "Created: $zip"

      - name: Setup Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress

      - name: Build Installer
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"

          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"

          if (-not (Test-Path $iscc)) {
            $iscc = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          }

          if (-not (Test-Path $iscc)) {
            Write-Error "Inno Setup compiler (ISCC.exe) was not found."
            exit 1
          }

          Write-Host "Using Inno Setup: $iscc"

          & $iscc `
            "/DMyAppVersion=$version" `
            "installer\guit.iss"

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Inno Setup failed with exit code $LASTEXITCODE."
            exit $LASTEXITCODE
          }

      - name: Verify Installer
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $installer = "build/installer/Guit-$version-windows-x64-Setup.exe"

          if (-not (Test-Path $installer)) {
            Write-Error "Installer was not found at: $installer"
            Write-Host "Installer directory contents:"
            Get-ChildItem -Recurse build/installer -ErrorAction SilentlyContinue
            exit 1
          }

          Write-Host "Installer created successfully:"
          Get-Item $installer

      - name: Generate Checksums
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"

          $zip = "build/Guit-$version-windows-x64.zip"
          $exe = "build/deploy/guit.exe"
          $installer = "build/installer/Guit-$version-windows-x64-Setup.exe"

          if (-not (Test-Path $zip)) {
            Write-Error "Missing portable package: $zip"
            exit 1
          }

          if (-not (Test-Path $exe)) {
            Write-Error "Missing executable: $exe"
            exit 1
          }

          if (-not (Test-Path $installer)) {
            Write-Error "Missing installer: $installer"
            exit 1
          }

          $zipHash = (Get-FileHash -Algorithm SHA256 $zip).Hash
          $exeHash = (Get-FileHash -Algorithm SHA256 $exe).Hash
          $installerHash = (Get-FileHash -Algorithm SHA256 $installer).Hash

          @"
          Guit $version SHA-256 Checksums

          $zipHash  Guit-$version-windows-x64.zip
          $installerHash  Guit-$version-windows-x64-Setup.exe
          $exeHash  guit.exe
          "@ | Out-File `
            -FilePath build/SHA256SUMS.txt `
            -Encoding utf8

          Write-Host ""
          Write-Host "SHA-256 checksums:"
          Get-Content build/SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Guit ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true

          body: |
            ## Guit ${{ github.ref_name }}

            A modern graphical Git client that makes Git easier to understand and use without hiding the underlying Git workflow.

            ### Downloads

            - **Installer:** `Guit-${{ steps.version.outputs.version }}-windows-x64-Setup.exe`
            - **Portable:** `Guit-${{ steps.version.outputs.version }}-windows-x64.zip`
            - **Checksums:** `SHA256SUMS.txt`

            ### Requirements

            - Windows 10 or Windows 11
            - Git for Windows

            ### Verification

            SHA-256 checksums are provided in `SHA256SUMS.txt`.

            See the full changelog in [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md).

          files: |
            build/Guit-*-windows-x64.zip
            build/installer/Guit-*-windows-x64-Setup.exe
            build/SHA256SUMS.txt

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
